<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div id="giris-ekrani">
    <div id="baslik">
      <span style="color:red">X</span>
      <span style="color:blue">O</span>
      <span style="color:red">X</span>
    </div>

    <div id="tur-secimi">
      <p>Kaç tur oynanacak?</p>
      <button class="turBtn" data-tur="1">1 TUR</button>
      <button class="turBtn secili" data-tur="3">3 TUR</button>
      <button class="turBtn" data-tur="5">5 TUR</button>
    </div>

    <button id="playBtn">PLAY</button>
  </div>

  <!-- OYUN EKRANI -->
  <div id="oyun-ekrani">
    <button id="menuBtn">☰ MENÜ</button>

    <div id="menuKutusu">
      <button id="anaMenuBtn">ANA MENÜYE DÖN</button>
    </div>

    <p id="skor">X: 0 &nbsp;|&nbsp; O: 0 &nbsp;|&nbsp; Tur: 1 / 3</p>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <p id="durum"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
